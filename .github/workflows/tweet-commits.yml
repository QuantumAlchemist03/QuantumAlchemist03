name: Tweet Commits

on:
  push:
    branches:
      - main
      - master

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tweepy
        run: pip install tweepy

      - name: Post commit to X
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          python - <<'EOF'
          import os, subprocess, tweepy

          commit_hash = subprocess.check_output(
              ["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          commit_msg = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%B"]).decode().strip()
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{commit_hash}"

          short_msg = commit_msg.split("\n")[0][:80]
          tweet = f"📝 New commit on {repo}: {short_msg} → {url}"

          if len(tweet) > 250:
              print(f"Skipping — tweet is {len(tweet)} chars (over 250).")
              raise SystemExit(0)

          client = tweepy.Client(
              consumer_key=os.environ["TWITTER_API_KEY"],
              consumer_secret=os.environ["TWITTER_API_SECRET"],
              access_token=os.environ["TWITTER_ACCESS_TOKEN"],
              access_token_secret=os.environ["TWITTER_ACCESS_SECRET"],
          )
          client.create_tweet(text=tweet)
          print(f"Posted ({len(tweet)} chars): {tweet}")
          EOF
